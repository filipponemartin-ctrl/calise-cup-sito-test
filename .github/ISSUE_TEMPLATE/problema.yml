name: Segnala un problema
description: Qualcosa nel sito non funziona o si vede male
labels: [problema]
body:
  - type: input
    id: pagina
    attributes:
      label: Pagina
      description: Indirizzo o nome della pagina
      placeholder: Amici e partner
    validations:
      required: true
  - type: textarea
    id: cosa
    attributes:
      label: Cosa succede
      description: Cosa vi aspettavate e cosa avete visto. Se potete, allegate una schermata.
    validations:
      required: true
  - type: dropdown
    id: dispositivo
    attributes:
      label: Dispositivo
      options:
        - Telefono
        - Tablet
        - Computer
    validations:
      required: true
  - type: input
    id: browser
    attributes:
      label: Browser
      placeholder: Chrome, Safari, Firefox…
