name: Controlli

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  controlli:
    name: Controlli (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['7.4', '8.3']
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none

      - name: Controlli del tema
        run: bin/check.sh

  pacchetto:
    name: Pacchetto del tema
    needs: controlli
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Crea il file zip
        run: bin/build-zip.sh

      - uses: actions/upload-artifact@v4
        with:
          name: calise-cup-tema
          path: dist/*.zip
          retention-days: 14
